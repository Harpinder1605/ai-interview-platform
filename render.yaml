services:
  # 1. FastAPI Backend (Web Service)
  - type: web
    name: ai-interview-backend
    env: docker
    rootDir: backend
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 8000
      - key: SECRET_KEY
        generateValue: true
      # These will show up as blank in your dashboard for you to paste safely
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

  # 2. React Frontend (Static Site)
  - type: web
    name: ai-interview-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false