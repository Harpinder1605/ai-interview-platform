version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite:///./ai_interview.db
      - GROQ_API_KEY=${GROQ_API_KEY:-your_groq_api_key_here}
      - SECRET_KEY=local-dev-secret-key-12345
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - ./backend/ai_interview.db:/app/ai_interview.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend